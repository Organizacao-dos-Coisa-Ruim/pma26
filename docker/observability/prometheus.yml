# Prometheus: coleta as métricas de cada serviço pela rede interna do compose.
# O label "application" é o que os dashboards do Grafana usam para separar os serviços.
global:
  # intervalo curto para os gráficos reagirem rápido durante o load test
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /gateway/actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          application: gateway

  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth:8080"]
        labels:
          application: auth

  - job_name: account
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account:8080"]
        labels:
          application: account

# Prometheus: coleta as métricas de cada serviço pela rede interna do compose.
# O label "application" é o que os dashboards do Grafana usam para separar os serviços.
global:
  # intervalo curto para os gráficos reagirem rápido durante o load test
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # O gateway roda em várias réplicas atrás do load balancer (gargalo #80). Em vez de um alvo fixo,
  # o Prometheus pergunta ao DNS do Docker o IP de cada réplica e coleta uma por uma: assim o label
  # "instance" separa as réplicas e o Grafana mostra quanto tráfego cada uma recebeu.
  - job_name: gateway
    metrics_path: /gateway/actuator/prometheus
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - target_label: application
        replacement: gateway

  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth:8080"]
        labels:
          application: auth

  - job_name: account
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account:8080"]
        labels:
          application: account

  - job_name: exchange
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["exchange:8080"]
        labels:
          application: exchange

  - job_name: product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product:8080"]
        labels:
          application: product

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order:8080"]
        labels:
          application: order

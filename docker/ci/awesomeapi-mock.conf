# Mock da AwesomeAPI para o CI (nginx).
#
# No GitHub Actions a AwesomeAPI real responde 429 (Too Many Requests): os runners usam IPs
# compartilhados e a API pública limita esses IPs. Com o mock, o smoke test e o scan do ZAP
# não dependem de uma API externa e o resultado é sempre o mesmo.
#
# Mesmo formato da API real: GET /json/last/USD-BRL -> {"USDBRL": {...}}; par desconhecido -> 404.
server {
    listen 80;
    default_type application/json;

    location = /json/last/USD-BRL {
        return 200 '{"USDBRL":{"code":"USD","codein":"BRL","name":"Dólar Americano/Real Brasileiro","bid":"5.6666","ask":"5.668","create_date":"2026-11-13 18:30:13"}}';
    }

    location = /json/last/EUR-BRL {
        return 200 '{"EURBRL":{"code":"EUR","codein":"BRL","name":"Euro/Real Brasileiro","bid":"6.2462","ask":"6.2482","create_date":"2026-11-13 19:21:35"}}';
    }

    location / {
        return 404 '{"status":404,"code":"CoinNotExists","message":"moeda nao encontrada"}';
    }
}

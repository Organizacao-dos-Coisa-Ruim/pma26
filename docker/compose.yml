# Sobe o sistema inteiro localmente.
#
#   cp docker/.env.example docker/.env   # e preencha as senhas
#   docker compose -f docker/compose.yml up --build
#
# Só o load balancer (lb, Nginx) publica porta para fora (http://localhost:8080) e distribui entre as
# réplicas do gateway. Os serviços se enxergam pelo nome (http://account:8080, http://auth:8080),
# igual aos Services do Kubernetes.

name: pma26

x-java-build: &java-build
  context: ../api
  dockerfile: ../docker/java-service.Dockerfile

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_DB:-store}
      POSTGRES_USER: ${DATABASE_USERNAME:-store}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  account:
    image: account
    build:
      <<: *java-build
      args:
        INTERFACES: account
        SERVICE: account-service
    environment:
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:-store}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-store}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
      # admin inicial (RBAC): criado na subida se o email ainda não existir
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: auth
    build:
      <<: *java-build
      args:
        INTERFACES: auth account
        SERVICE: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em docker/.env (mínimo de 32 caracteres)}
      JWT_DURATION: ${JWT_DURATION:-1h}
    depends_on:
      - account
    restart: unless-stopped

  exchange:
    image: exchange
    build:
      <<: *java-build
      args:
        INTERFACES: exchange
        SERVICE: exchange-service
    # sem banco: a cotação vem da AwesomeAPI (pública, sem chave) e fica em cache no Redis
    environment:
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:-https://economia.awesomeapi.com.br}
      REDIS_HOST: redis
      EXCHANGE_CACHE_TTL: ${EXCHANGE_CACHE_TTL:-5m}
      # "none" desliga o cache (para medir o antes/depois do gargalo #76)
      EXCHANGE_CACHE_TYPE: ${EXCHANGE_CACHE_TYPE:-redis}
    depends_on:
      - redis
    restart: unless-stopped

  # Cache das cotações do Exchange (gargalo #76). Sem porta publicada e sem volume:
  # é só cache, perder os dados num restart não tem problema (a próxima chamada busca de novo).
  redis:
    image: redis:7.4-alpine
    # limite de memória com descarte das chaves menos usadas, como num cache de verdade
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Catálogo de produtos (schema "products" no mesmo Postgres, criado pelo Flyway)
  product:
    image: product
    build:
      <<: *java-build
      args:
        INTERFACES: product
        SERVICE: product-service
    environment:
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:-store}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-store}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Pedidos (schema "orders"). Consulta preço e nome no product via Feign (http://product:8080).
  order:
    image: order
    build:
      <<: *java-build
      args:
        INTERFACES: order
        SERVICE: order-service
    environment:
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:-store}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-store}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
      PMA_PRODUCT_URL: http://product:8080
    depends_on:
      db:
        condition: service_healthy
      product:
        condition: service_started
    restart: unless-stopped

  # Várias réplicas do gateway atrás do load balancer (gargalo #80). Sem porta publicada:
  # quem recebe o tráfego de fora é o "lb", que distribui entre as réplicas.
  gateway:
    image: gateway
    build:
      <<: *java-build
      args:
        SERVICE: gateway-service
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    deploy:
      replicas: ${GATEWAY_REPLICAS:-3}
    depends_on:
      - account
      - auth
      - exchange
      - product
      - order
    restart: unless-stopped

  # Load balancer (Nginx): único ponto de entrada, em http://localhost:8080 (docker/nginx/nginx.conf)
  lb:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - gateway
    restart: unless-stopped

  # --- Observabilidade ---
  # Prometheus coleta /actuator/prometheus de cada serviço; Grafana mostra os dashboards.
  # Publicados só em 127.0.0.1 (acessíveis apenas desta máquina).

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
      - auth
      - account
      - exchange
      - product
      - order
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD em docker/.env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pma26-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db-data:
  prometheus-data:
  grafana-data:

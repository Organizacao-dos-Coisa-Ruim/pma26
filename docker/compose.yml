# Sobe o sistema inteiro localmente.
#
#   cp docker/.env.example docker/.env   # e preencha as senhas
#   docker compose -f docker/compose.yml up --build
#
# Só o gateway publica porta para fora (http://localhost:8080). Os serviços se enxergam
# pelo nome (http://account:8080, http://auth:8080), igual aos Services do Kubernetes.

name: pma26

x-java-build: &java-build
  context: ../api
  dockerfile: ../docker/java-service.Dockerfile

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_DB:-store}
      POSTGRES_USER: ${DATABASE_USERNAME:-store}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  account:
    image: account
    build:
      <<: *java-build
      args:
        INTERFACES: account
        SERVICE: account-service
    environment:
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:-store}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-store}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em docker/.env}
      # admin inicial (RBAC): criado na subida se o email ainda não existir
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: auth
    build:
      <<: *java-build
      args:
        INTERFACES: auth account
        SERVICE: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em docker/.env (mínimo de 32 caracteres)}
      JWT_DURATION: ${JWT_DURATION:-1h}
    depends_on:
      - account
    restart: unless-stopped

  gateway:
    image: gateway
    build:
      <<: *java-build
      args:
        SERVICE: gateway-service
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - account
      - auth
    restart: unless-stopped

  # --- Observabilidade ---
  # Prometheus coleta /actuator/prometheus de cada serviço; Grafana mostra os dashboards.
  # Publicados só em 127.0.0.1 (acessíveis apenas desta máquina).

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
      - auth
      - account
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD em docker/.env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pma26-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db-data:
  prometheus-data:
  grafana-data:

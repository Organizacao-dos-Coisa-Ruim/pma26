# Load balancer na frente das réplicas do gateway (gargalo #80).
#
# O cliente fala só com o Nginx (http://localhost:8080). O Nginx distribui as requisições entre as
# réplicas do gateway em round-robin (uma para cada, em rodízio) e tira da roda a réplica que falhar.
# No EKS, quem faz esse papel é o Service do tipo LoadBalancer (um ELB da AWS) na frente dos pods do HPA.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # não mostrar a versão do Nginx no header "Server" (o scan do ZAP alerta)
  server_tokens off;

  # DNS interno do Docker: "gateway" responde com o IP de cada réplica do serviço
  resolver 127.0.0.11 valid=10s ipv6=off;

  # uma linha por requisição, com a réplica que atendeu (upstream=IP:porta): é a evidência da distribuição
  log_format lb '$remote_addr "$request" $status upstream=$upstream_addr tempo=$upstream_response_time';
  access_log /dev/stdout lb;

  upstream gateway {
    # memória compartilhada entre os workers, exigida pelo "resolve"
    zone gateway 64k;
    # resolve: consulta o DNS de novo (a cada "valid=10s") e acha réplicas novas ou recriadas sem reiniciar
    # max_fails/fail_timeout: depois de 1 falha, a réplica sai da roda por 10 s
    server gateway:8080 resolve max_fails=1 fail_timeout=10s;
    # reaproveita conexões com as réplicas em vez de abrir uma por requisição
    keepalive 32;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # réplica fora do ar: tenta a próxima. O Nginx só repete GET/HEAD (idempotentes);
      # um POST nunca é enviado duas vezes, para não criar um pedido em dobro.
      proxy_next_upstream error timeout http_502 http_503;
      # dentro da rede do Docker uma conexão leva < 1 ms: 1 s já indica réplica morta (é o atraso no pior caso)
      proxy_connect_timeout 1s;
    }
  }
}

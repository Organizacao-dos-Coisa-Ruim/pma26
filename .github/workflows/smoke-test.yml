# Teste de integração do sistema inteiro: builda todos os serviços pelo compose,
# sobe tudo, roda docker/smoke-test.sh (register -> login -> rotas protegidas -> RBAC)
# e o scan de vulnerabilidades docker/zap-scan.sh (OWASP ZAP).
# Roda em todo PR/push do pma26, ou seja, sempre que um ponteiro de submodule muda.
name: Smoke test (compose)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Gerar docker/.env com segredos aleatórios (só para este job)
        # o resto das variáveis usa os padrões do compose.yml
        run: |
          {
            echo "DATABASE_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "ADMIN_EMAIL=admin@pma26.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > docker/.env

      - name: Build e subida
        run: docker compose -f docker/compose.yml up --build -d

      - name: Smoke test
        run: |
          set -a; . docker/.env; set +a
          bash docker/smoke-test.sh

      # Scan de vulnerabilidades (gargalo #78): OWASP ZAP ataca as rotas do gateway (docs/openapi.yaml).
      # Qualquer alerta WARN/FAIL quebra o job; o relatório fica nos artefatos do workflow.
      - name: Scan de vulnerabilidades (OWASP ZAP)
        run: bash docker/zap-scan.sh zap-report

      - name: Relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/zap-report.*
          if-no-files-found: ignore

      - name: Logs dos serviços (se falhar)
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color account auth exchange gateway

      - name: Derrubar
        if: always()
        run: docker compose -f docker/compose.yml down -v

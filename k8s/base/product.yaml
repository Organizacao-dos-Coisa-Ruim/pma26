# Product: catálogo de produtos. Usa o Postgres (schema "products"; no EKS, o RDS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels: { app: product }
spec:
  replicas: 1
  selector:
    matchLabels: { app: product }
  template:
    metadata:
      labels: { app: product }
    spec:
      containers:
        - name: product
          image: product
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: pma26-config }
          env:
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: pma26-secrets, key: DATABASE_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product
  labels: { app: product }
spec:
  selector: { app: product }
  ports:
    - { name: http, port: 8080, targetPort: http }

# Exchange: cotação entre moedas (AwesomeAPI), com cache no Redis (gargalo #76).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  labels: { app: exchange }
spec:
  replicas: 1
  selector:
    matchLabels: { app: exchange }
  template:
    metadata:
      labels: { app: exchange }
    spec:
      containers:
        - name: exchange
          image: exchange
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: pma26-config }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  labels: { app: exchange }
spec:
  selector: { app: exchange }
  ports:
    - { name: http, port: 8080, targetPort: http }

# Base: o que é igual no kind e no EKS. Os overlays (k8s/overlays/*) completam com
# banco, imagens, exposição do gateway e os segredos.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pma26

resources:
  - namespace.yaml
  - account.yaml
  - auth.yaml
  - exchange.yaml
  - gateway.yaml
  - redis.yaml

patches:
  # Por padrão o Kubernetes injeta em cada pod variáveis com os endereços dos Services no formato
  # antigo do Docker (REDIS_PORT=tcp://10.96.x.x:6379, AUTH_PORT=..., ACCOUNT_PORT=...). O exchange
  # usa REDIS_PORT como número da porta e quebrava ao subir. Os serviços se acham pelo DNS
  # (http://redis, http://account:8080), então essas variáveis não são necessárias.
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false

# Configuração sem segredo, lida pelos serviços como variáveis de ambiente (envFrom).
# Os nomes dos hosts são os Services do Kubernetes, igual aos nomes do compose.
configMapGenerator:
  - name: pma26-config
    literals:
      # account
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=store
      - DATABASE_USERNAME=store
      # auth / gateway
      - ACCOUNT_URL=http://account:8080
      - AUTH_URL=http://auth:8080
      - EXCHANGE_URL=http://exchange:8080
      - JWT_DURATION=1h
      - CORS_ALLOWED_ORIGINS=*
      # exchange
      - REDIS_HOST=redis
      - EXCHANGE_CACHE_TTL=5m
      - EXCHANGE_API_URL=https://economia.awesomeapi.com.br
      # a JVM usa até 75% do limite de memória do container (o padrão é só 25%)
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
